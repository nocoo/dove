# Dove CD — triggered by `v*.*.*` tag push from scripts/release.ts.
# Builds UI, deploys Worker to Cloudflare, verifies /api/live.
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy (e.g. v0.4.4)"
        required: true
        type: string

jobs:
  deploy-worker:
    name: Deploy Worker (production)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-worker-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version
        id: ver
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=$TAG"          >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"
          PKG_VERSION=$(jq -r .version package.json)
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "❌ Tag $TAG does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build UI (into dist/client)
        run: bun run build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify /api/live reports new version
        run: |
          set -e
          EXPECTED="${{ steps.ver.outputs.version }}"
          for i in 1 2 3 4 5 6; do
            ACTUAL=$(curl -fsS https://dove.hexly.ai/api/live | jq -r .version)
            echo "attempt $i: live=$ACTUAL expected=$EXPECTED"
            if [ "$ACTUAL" = "$EXPECTED" ]; then
              echo "✅ Live version matches"
              exit 0
            fi
            sleep 5
          done
          echo "❌ /api/live did not report $EXPECTED after 30s"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Dove Release ${{ steps.ver.outputs.tag }}"
            echo ""
            echo "- Worker: deployed to \`dove\` (production)"
            echo "- Verify: https://dove.hexly.ai/api/live"
          } >> "$GITHUB_STEP_SUMMARY"
