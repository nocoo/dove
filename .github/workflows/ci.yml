name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      runtime-version: "1.3.11"
      install-policy: "trusted"
      coverage-path: "coverage"
      prepare-command: |
        bun run scripts/setup-ci-env.ts
        bun run build
      test-command: "bun run test:coverage"
      typecheck-command: "bun run typecheck"
      osv-config: "osv-scanner.toml"
      l2: true
      l2-command: "bun run test:e2e:api"
      l3: true
      l3-command: "bun run test:e2e:bdd"
      l3-browser: "chromium"
