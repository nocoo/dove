name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────
  # L1 + G1 + G2 + L2 + L3 — All via base-ci
  #
  # ISOLATION: L2/L3 use wrangler dev with local SQLite D1.
  # No remote database connection — completely isolated.
  # ─────────────────────────────────────────────────────
  quality:
    uses: nocoo/base-ci/.github/workflows/bun-quality.yml@v2026.4
    with:
      bun-version: "1.3.11"
      pre-command: "bun run scripts/setup-ci-env.ts && bun run build"
      test-command: "bun run test:coverage"
      typecheck-command: "bun run typecheck"
      osv-config: "osv-scanner.toml"
      enable-l2: "true"
      l2-command: "bun run test:e2e:api"
      enable-l3: "true"
      l3-command: "bun run test:e2e:bdd"
      l3-browser: "chromium"
      enable-worker: "false"
    secrets: inherit
