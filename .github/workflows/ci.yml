# CI slot standard v1 (nocoo/base-ci docs/slots.md): impl S1, S2, S3, G1, G2, B1, L1, L2, L3, Z1 via quality.yml;
# na L1.5, P1 in slot-status. nocoo/base-ci v2026.12: top-level slot jobs, L2/L3 evidence artifacts.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
    with:
      runtime-version: "1.3.11"
      install-policy: trusted
      coverage-path: coverage
      test-command: bun run test:coverage
      typecheck-command: bun run typecheck
      osv-config: osv-scanner.toml
      gitleaks-config: .gitleaks.toml
      prepare-command: |
        bun run scripts/setup-ci-env.ts
        bun run build
      build: true
      build-command: bun run build
      workflow-lint: true
      workflow-lint-required-workflow: nocoo/base-ci/.github/workflows/deploy-worker.yml
      workflow-lint-yamllint: true
      l2: true
      l2-command: bun run test:e2e:api
      l3: true
      l3-browsers: chromium
      l3-command: bun run test:e2e:bdd
      l3-artifact-name: browser-evidence
      l3-artifact-path: |
        playwright-report/
        test-results/
      l3-artifact-retention-days: 7
      env-json: '{"WRANGLER_SEND_METRICS": "false", "CI": "true"}'
      slot-status: >-
        {"S1": {"status": "impl"},
        "S2": {"status": "impl"},
        "S3": {"status": "impl"},
        "G1": {"status": "impl"},
        "G2": {"status": "impl"},
        "B1": {"status": "impl"},
        "L1": {"status": "impl"},
        "L1.5": {"status": "na", "reason": "无 @cloudflare/vitest-pool-workers / miniflare Worker 运行时测试套件"},
        "L2": {"status": "impl"},
        "L3": {"status": "impl"},
        "P1": {"status": "na", "reason": "package.json 为 private，不发布 npm 包"},
        "Z1": {"status": "impl"}}
