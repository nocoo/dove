name = "dove"
main = "src/server/index.ts"
compatibility_date = "2026-04-01"

[dev]
port = 7034

# Static assets (Vite build output)
[assets]
directory = "./dist/client"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

# Custom domain
[[routes]]
pattern = "dove.hexly.ai"
custom_domain = true

# D1 Database (remote in dev for prod data access)
[[d1_databases]]
binding = "DB"
database_name = "dove-db"
database_id = "2a8b6614-2c00-4891-863e-df80d22a2421"
remote = true

# Email
[[send_email]]
name = "EMAIL"

# ─────────────────────────────────────────────────────────────────────────────
# Test environment (local wrangler dev only, never deployed)
# ─────────────────────────────────────────────────────────────────────────────

[env.test]

[[env.test.d1_databases]]
binding = "DB"
database_name = "dove-db-test"
database_id = "1adca6ff-076f-45ff-a4d6-a1fdae9397ea"


